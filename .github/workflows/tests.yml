name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Unit tests on synthetic data (no downloads)
        run: python run_all.py --tests
